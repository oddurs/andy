name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README promises; 3.13 is what people have.
        # Both platforms, because andy claims to run on both.
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: it parses on this version
        run: python -m compileall -q andy tests

      - name: unit tests
        run: python -m unittest discover -s tests -v

      - name: it runs on a real tree
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/app/node_modules" "$root/svc/target" "$root/svc/.git"
          : > "$root/app/package.json"
          : > "$root/svc/Cargo.toml"
          dd if=/dev/zero of="$root/app/node_modules/big.bin" bs=1024 count=6144 2>/dev/null
          dd if=/dev/zero of="$root/svc/target/out.bin"       bs=1024 count=4096 2>/dev/null

          # A fresh empty HOME per run, so each depends on the tree above and
          # nothing else -- including andy's own cache, which the first run
          # would otherwise leave under ~/.cache for the second one to measure.
          fresh_home() { export HOME="$(mktemp -d)"; export XDG_CACHE_HOME="$HOME/.cache"; }

          # The runners have a docker daemon with images loaded, and on Linux
          # andy counts what it reports. Point docker at nothing so these
          # assertions are about the tree above and not about the runner.
          export DOCKER_HOST=unix:///nonexistent/andy-ci.sock

          fresh_home
          python andy --json --fresh "$root" > out.json
          python - <<'PY'
          import json, sys
          doc = json.load(open("out.json"))
          assert doc["mapped_bytes"] >= 10 * 2**20, doc["mapped_bytes"]
          assert sum(c["bytes"] for c in doc["categories"]) == doc["mapped_bytes"]
          labels = {c["label"] for c in doc["categories"]}
          assert "project artifacts" in labels, labels
          assert doc["platform"] in ("darwin", "linux"), doc["platform"]
          print("json ok:", doc["mapped_bytes"], "bytes,", doc["platform"])
          PY

          # the in-process engine must agree with du to the byte
          fresh_home
          python andy --json --fresh --walk "$root" > walk.json
          python - <<'PY'
          import json
          a = json.load(open("out.json"))["mapped_bytes"]
          b = json.load(open("walk.json"))["mapped_bytes"]
          assert a == b, f"du said {a}, the walker said {b}"
          print("both engines agree:", a)
          PY

          # the other output formats, and the promise that --commands runs nothing
          fresh_home
          python andy --fresh -n 5 "$root" > /dev/null
          python andy --tree --fresh "$root" > /dev/null
          python andy --commands --fresh -m 1M "$root" > cmds.sh
          if grep -vqE '^(#.*)?$' cmds.sh; then
            echo "--commands emitted an executable line:"; cat cmds.sh; exit 1
          fi

          # -i without a terminal is an error, not a traceback
          if python andy -i "$root"; then echo "-i should have failed"; exit 1; fi
          echo "all good"

  # The clipboard is the one thing andy does that leaves the process, and the
  # only way to know it works is to give it a display server and read the
  # clipboard back. Linux only: macOS has pbcopy and no headless session.
  clipboard:
    name: clipboard · wayland and x11
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install display servers and clipboard tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xclip xsel wl-clipboard sway

      - name: x11, via xclip
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          sudo mv /usr/bin/wl-copy /usr/bin/wl-copy.hidden
          DISPLAY=:99 python tests/clipboard_check.py x11
        env:
          PYTHONPATH: tests

      - name: x11, when only xsel is installed
        run: |
          sudo mv /usr/bin/xclip /usr/bin/xclip.hidden
          DISPLAY=:99 python tests/clipboard_check.py x11-xsel
          sudo mv /usr/bin/xclip.hidden /usr/bin/xclip
          sudo mv /usr/bin/wl-copy.hidden /usr/bin/wl-copy
        env:
          PYTHONPATH: tests

      - name: wayland, via wl-copy on headless sway
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
          : > /tmp/sway.conf
          sway -c /tmp/sway.conf > /tmp/sway.log 2>&1 &
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/wayland-1" ] && break
            sleep 1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-1" ]; then cat /tmp/sway.log; exit 1; fi
          WAYLAND_DISPLAY=wayland-1 python tests/clipboard_check.py wayland
        env:
          PYTHONPATH: tests

      - name: nothing installed at all
        run: |
          sudo mv /usr/bin/wl-copy /usr/bin/wl-copy.hidden
          sudo mv /usr/bin/xclip /usr/bin/xclip.hidden
          sudo mv /usr/bin/xsel /usr/bin/xsel.hidden
          python tests/clipboard_check.py none
        env:
          PYTHONPATH: tests

  # ubuntu-latest is one shape of Linux: glibc, a full Python, a UTF-8 locale
  # and default XDG paths. Every bug in the v1.2 milestone was invisible there.
  shapes:
    name: ${{ matrix.shape }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shape: [musl, no-curses, c-locale, xdg-elsewhere, no-home]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.shape != 'musl'
        with:
          python-version: "3.13"

      - name: build the tree to scan
        shell: bash
        run: |
          mkdir -p /tmp/t/app/node_modules /tmp/t/svc/target
          : > /tmp/t/app/package.json
          : > /tmp/t/svc/Cargo.toml
          dd if=/dev/zero of=/tmp/t/app/node_modules/b.bin bs=1M count=6 2>/dev/null
          dd if=/dev/zero of=/tmp/t/svc/target/c.bin bs=1M count=4 2>/dev/null

      # musl and busybox, not glibc and coreutils
      - name: musl
        if: matrix.shape == 'musl'
        run: |
          docker run --rm -v "$PWD":/w -v /tmp/t:/tmp/t -w /w alpine:latest sh -c '
            set -e
            apk add --no-cache python3 >/dev/null
            export DOCKER_HOST=unix:///nonexistent
            python3 -m unittest discover -s tests
            HOME=$(mktemp -d) python3 andy --json --fresh /tmp/t > /tmp/a.json
            HOME=$(mktemp -d) python3 andy --json --fresh --walk /tmp/t > /tmp/b.json
            python3 -c "
          import json
          a = json.load(open(\"/tmp/a.json\"))[\"mapped_bytes\"]
          b = json.load(open(\"/tmp/b.json\"))[\"mapped_bytes\"]
          assert a == b, f\"busybox du said {a}, the walker said {b}\"
          assert a >= 10 * 2**20, a
          print(\"musl ok:\", a)
          "'

      # a Python built without ncurses: every mode but -i must still work
      - name: no-curses
        if: matrix.shape == 'no-curses'
        shell: bash
        run: |
          export DOCKER_HOST=unix:///nonexistent HOME=$(mktemp -d)
          sudo mv "$(python -c 'import _curses; print(_curses.__file__)')" /tmp/curses.hidden
          python -c "import _curses" 2>/dev/null && { echo "still importable"; exit 1; }
          python andy --json --fresh /tmp/t > /dev/null
          python andy --tree --fresh /tmp/t > /dev/null
          python andy --commands --fresh /tmp/t > /dev/null
          python andy --fresh -n 3 /tmp/t > /dev/null
          if python andy -i /tmp/t 2>/tmp/e.txt; then echo "-i should have failed"; exit 1; fi
          grep -q curses /tmp/e.txt || { echo "no explanation given:"; cat /tmp/e.txt; exit 1; }
          python -m unittest discover -s tests
          echo "no-curses ok"        # nothing to restore; the job ends here

      # PEP 538 coercion defeated: the drawing characters must not be fatal
      - name: c-locale
        if: matrix.shape == 'c-locale'
        shell: bash
        run: |
          export DOCKER_HOST=unix:///nonexistent HOME=$(mktemp -d)
          export PYTHONCOERCECLOCALE=0 PYTHONUTF8=0 LC_ALL=C LANG=C
          for mode in "-n 3" "--tree" "--commands" "--json"; do
            python andy --fresh $mode /tmp/t > /tmp/out.txt 2>/tmp/err.txt || {
              echo "failed: $mode"; tail -5 /tmp/err.txt; exit 1; }
            python - <<'PY'
          data = open("/tmp/out.txt", "rb").read()
          bad = [b for b in data if b > 127]
          assert not bad, f"non-ascii bytes in a C locale: {bad[:8]}"
          PY
          done
          python -m unittest discover -s tests
          echo "c-locale ok"

      # XDG_* pointed somewhere else entirely
      - name: xdg-elsewhere
        if: matrix.shape == 'xdg-elsewhere'
        shell: bash
        run: |
          export DOCKER_HOST=unix:///nonexistent HOME=$(mktemp -d)
          export XDG_CACHE_HOME=/tmp/xdg/cache XDG_DATA_HOME=/tmp/xdg/data
          export XDG_CONFIG_HOME=/tmp/xdg/config XDG_STATE_HOME=/tmp/xdg/state
          # mise is in the portable half of the catalog, so this step means the
          # same thing whichever platform it is run on
          mkdir -p "$XDG_CACHE_HOME/go-build" "$XDG_DATA_HOME/mise"
          dd if=/dev/zero of="$XDG_CACHE_HOME/go-build/x" bs=1M count=14 2>/dev/null
          dd if=/dev/zero of="$XDG_DATA_HOME/mise/x" bs=1M count=12 2>/dev/null
          python andy --json --fresh /tmp/t > /tmp/x.json
          python - <<'PY'
          import json
          doc = json.load(open("/tmp/x.json"))
          paths = []
          def visit(n):
              paths.append(n.get("path", ""))
              for c in n.get("children", ()):
                  visit(c)
          for c in doc["categories"]:
              visit(c)
          assert any(p.startswith("/tmp/xdg/cache") for p in paths), "XDG_CACHE_HOME ignored"
          assert any(p.startswith("/tmp/xdg/data") for p in paths), "XDG_DATA_HOME ignored"
          assert not any("/.cache" in p for p in paths), "looked in ~/.cache anyway"
          print("xdg ok")
          PY

      # a HOME that was never created, as containers and systemd units hand over
      - name: no-home
        if: matrix.shape == 'no-home'
        shell: bash
        run: |
          export DOCKER_HOST=unix:///nonexistent HOME=/tmp/never-created-at-all
          python andy --json --fresh /tmp/t > /dev/null
          python andy --fresh -n 3 /tmp/t > /dev/null
          echo "no-home ok"
